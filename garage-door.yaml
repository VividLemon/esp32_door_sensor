# ESPHome version of the ESP32 garage door controller.
#
# Hardware:
#   GPIO23  reed switch to GND, internal pull-up   (HIGH = door OPEN)
#   GPIO13  relay module, active-LOW               (300 ms pulse = press opener button)
#
# Talks to Home Assistant over ESPHome's native API.

substitutions:
  name: garage-door
  friendly_name: Garage Door

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # "arduino" also works

logger:

api:
  encryption:
    key: !secret garage_door__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi is unreachable, the device starts its own hotspot so you can fix it
  ap:
    ssid: ${friendly_name} Fallback Hotspot

captive_portal:

# --- Door position sensor -----------------------------------------------------
binary_sensor:
  - platform: gpio
    id: door_contact
    name: "Door Contact"
    internal: true         # HA only needs the cover entity below
    device_class: garage_door
    pin:
      number: GPIO23
      mode:
        input: true
        pullup: true
    # Not inverted: HIGH (switch open) = door OPEN
    filters:
      - delayed_on_off: 75ms   # debounce

# --- Relay --------------------------------------------------------------------
output:
  - platform: gpio
    id: relay_out
    pin:
      number: GPIO13
      inverted: true       # relay board is active-LOW; boots released

script:
  - id: pulse_relay
    mode: single           # ignore new commands while a pulse is running
    then:
      - output.turn_on: relay_out
      - delay: 300ms
      - output.turn_off: relay_out

# --- The entity Home Assistant sees -------------------------------------------
cover:
  - platform: template
    id: garage_door
    name: "Garage Door"
    device_class: garage
    lambda: |-
      return id(door_contact).state ? COVER_OPEN : COVER_CLOSED;
    # Skip the pulse if the door is already in the requested state
    open_action:
      - if:
          condition:
            binary_sensor.is_off: door_contact
          then:
            - script.execute: pulse_relay
    close_action:
      - if:
          condition:
            binary_sensor.is_on: door_contact
          then:
            - script.execute: pulse_relay
